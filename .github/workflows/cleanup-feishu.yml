name: Cleanup invalid Feishu data

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete WAF records and removed fields
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          API_BASE = "https://open.feishu.cn/open-apis"
          APP_TOKEN = "VifgbgBseaSpyIsCpH8cIlqVnub"
          TABLE_ID = "tblphxHROAQPFf4k"
          RECORD_IDS = (
              "recvsaqBcjT8sH",
              "recvsaqBcjd4V6",
              "recvsaqBcj7fnj",
              "recvsaqBcjObNl",
              "recvsaqBcj34jo",
              "recvsaqBcjG3rA",
              "recvsaqBcjeOIu",
              "recvsaqBcjkCcJ",
              "recvsaqBcjRWdb",
              "recvsaqBcjl6cx",
          )
          FIELD_IDS = (
              "fldNiVrtib",  # 分类
              "flduJkDZvk",  # 代码链接
          )

          def request_json(method, path, *, body=None, token=None):
              data = None if body is None else json.dumps(body).encode("utf-8")
              headers = {"Content-Type": "application/json"}
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              request = Request(f"{API_BASE}{path}", data=data, headers=headers, method=method)
              with urlopen(request, timeout=30) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              if payload.get("code") != 0:
                  raise RuntimeError(f"Feishu {method} {path} failed: {payload}")
              return payload

          token_payload = request_json(
              "POST",
              "/auth/v3/tenant_access_token/internal",
              body={
                  "app_id": os.environ["FEISHU_APP_ID"],
                  "app_secret": os.environ["FEISHU_APP_SECRET"],
              },
          )
          token = token_payload.get("tenant_access_token")
          if not token:
              raise RuntimeError("Feishu token response is missing tenant_access_token")

          table_path = f"/bitable/v1/apps/{APP_TOKEN}/tables/{TABLE_ID}"
          for record_id in RECORD_IDS:
              request_json("DELETE", f"{table_path}/records/{record_id}", token=token)
              print(f"Deleted record {record_id}")

          for field_id in FIELD_IDS:
              request_json("DELETE", f"{table_path}/fields/{field_id}", token=token)
              print(f"Deleted field {field_id}")
          PY
